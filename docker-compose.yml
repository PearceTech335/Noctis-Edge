# =============================================================================
#  Noctis Edge — Docker Compose
#
#  Services:
#    ollama   — local LLM server (official image, persists models in a volume)
#    noctis   — scanner + web UI  (built from ./Dockerfile)
#
#  Quick start:
#    ./docker-run.sh          (Linux / macOS)
#    .\docker-run.ps1         (Windows PowerShell)
#
#  Manual:
#    docker compose build
#    docker compose up -d

#    docker compose exec ollama ollama pull qwen2.5-coder:7b-instruct
#    # Open http://localhost:8888
#
#  CLI scan (without web UI):
#    docker compose run --rm noctis scan 192.168.0.1
#    docker compose run --rm noctis scan 192.168.0.1 web --cve-test
#
#  Stop:
#    docker compose down
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Ollama — local LLM server
  # ---------------------------------------------------------------------------
  ollama:
    # Pinned to a known-good stable release for the local Ollama sidecar.
    # Bump intentionally after re-verifying the curl check in
    # improvements/fp-hardening-plan.md (Wave 0).
    image: ollama/ollama:0.5.7
    container_name: noctis-ollama
    environment:
      # Keep loaded models resident for the full scan — matches per-request
      # keep_alive Noctis sends. Server-side default is 5m which would evict
      # mid-phase between tool runs.
      - OLLAMA_KEEP_ALIVE=1h
      # Flash-attention reduces attention-step cost ~15–25% on CPUs that
      # support the required instructions; safe no-op on others.
      - OLLAMA_FLASH_ATTENTION=1
    volumes:
      # Persist downloaded models across container restarts
      - ollama_models:/root/.ollama
      # Sync container clock with host timezone
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    ports:
      - "11434:11434"
    # ── GPU acceleration (optional) ──────────────────────────────────────────
    # Uncomment the deploy block below to use an NVIDIA GPU.
    # Requires: nvidia-container-toolkit installed on the Docker host.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/11434'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Noctis Edge — scanner + web UI
  # ---------------------------------------------------------------------------
  noctis:
    build:
      context: .
      dockerfile: Dockerfile
    image: noctis-edge:latest
    container_name: noctis-edge
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      # Point Noctis at the Ollama sidecar (service name resolves inside compose network)
      - NOCTIS_OLLAMA_URL=http://ollama:11434/api/generate
      # Single physical model for all LLM tasks: planning, structured JSON,
      # CVE probe scripts, executive summary, audit, attacker perspectives,
      # and per-finding descriptions.
      - NOCTIS_OLLAMA_MODEL=qwen2.5-coder:3b-instruct
      - NOCTIS_OLLAMA_SCRIPT_MODEL=qwen2.5-coder:3b-instruct
      - NOCTIS_OLLAMA_TIMEOUT=600
      # Bind to all interfaces so the host browser can reach port 8888
      - NOCTIS_BIND_HOST=0.0.0.0
      # Inherit host timezone so timestamps match the host clock
      - TZ=${TZ:-UTC}
    ports:
      - "8888:8888"
    volumes:
      # Persist scan sessions on the host so reports survive container restarts
      - ./sessions:/app/sessions
      # Persist all KB assets (CVE probes, tool KB, tool manifest, NSE scripts)
      - ./Noctis-Edge-KB:/app/Noctis-Edge-KB
      # Persist per-user config (installation UUID, license key, etc.)
      - ./noctis.conf:/app/noctis.conf
      # Bind-mount CVE dir so host update.sh refreshes EPSS/NVD data in-container
      - ./CVE:/app/CVE
      # Persist Nuclei template knowledge base (accumulated generated templates)
      - ./nuclei_kb.json:/app/nuclei_kb.json
      # Sync container clock with host timezone
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    # nmap SYN scans need raw socket capabilities
    cap_add:
      - NET_RAW
      - NET_ADMIN
    stdin_open: true
    tty: true
    restart: unless-stopped

# ---------------------------------------------------------------------------
# Named volumes
# ---------------------------------------------------------------------------
volumes:
  ollama_models:
    driver: local
