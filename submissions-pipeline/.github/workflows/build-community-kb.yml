name: Build Community KB

on:
  push:
    branches: [main]
    paths:
      - "*.json"
      - "quarantine/**"
  schedule:
    # Weekly full-repo scan + rebuild every Sunday at 03:00 UTC
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write   # needed for quarantine commits on weekly scan

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Noctis-Edge-Submissions
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # -----------------------------------------------------------------
      # Weekly cron: full-repo validation scan before building
      # -----------------------------------------------------------------
      - name: Full-repo validation scan (weekly cron only)
        if: github.event_name == 'schedule'
        id: full-scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/validate_submissions.py --all
        continue-on-error: true

      - name: Commit any quarantines from weekly scan
        if: github.event_name == 'schedule' && steps.full-scan.outcome == 'failure'
        run: |
          git config user.email "actions@github.com"
          git config user.name  "GitHub Actions"
          git add quarantine/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "quarantine: weekly scan $(date -u +%Y-%m-%d)"
          git push

      # -----------------------------------------------------------------
      # Build sharded community CVE KB (CVE_KB/ + manifest.json)
      # -----------------------------------------------------------------
      - name: Build sharded community CVE KB
        env:
          ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID }}
        run: |
          if [ -n "$ADMIN_USER_ID" ]; then
            python3 scripts/build_community_kb.py CVE_KB --trust-admin "$ADMIN_USER_ID"
          else
            python3 scripts/build_community_kb.py CVE_KB
          fi

      # -----------------------------------------------------------------
      # Push to Noctis-Edge-KB (private repo)
      # -----------------------------------------------------------------
      - name: Clone Noctis-Edge-KB
        run: |
          git clone \
            --depth=1 \
            https://x-access-token:${{ secrets.KB_PUSH_TOKEN }}@github.com/PearceTech335/Noctis-Edge-KB.git \
            /tmp/noctis-edge-kb

      - name: Copy and push sharded CVE_KB
        run: |
          rm -rf /tmp/noctis-edge-kb/CVE_KB
          mkdir -p /tmp/noctis-edge-kb/CVE_KB
          cp -R CVE_KB/. /tmp/noctis-edge-kb/CVE_KB/
          cd /tmp/noctis-edge-kb
          git config user.email "actions@github.com"
          git config user.name  "GitHub Actions"
          git add CVE_KB
          git diff --cached --quiet && echo "No changes to sharded community KB" && exit 0
          git commit -m "rebuild shards: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
