name: Track Repository Traffic

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  track-traffic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Collect and merge traffic history
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_TRAFFIC_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TRAFFIC_ARTIFACT_NAME: repo-traffic-history
        run: |
          python scripts/track_repo_traffic.py

      - name: Upload traffic history artifact
        uses: actions/upload-artifact@v4
        with:
          name: repo-traffic-history
          path: traffic-history/
          retention-days: 90

      - name: Job summary
        if: always()
        run: |
          if [ -f traffic-history/summary.md ]; then
            cat traffic-history/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
       
